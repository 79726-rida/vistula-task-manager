<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Task Manager</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Task Manager</h1>
    <p>Vistula Student ID: <span id="student-id">79726</span></p>
  </header>

  <main>
    <section class="form-section">
      <form id="task-form">
        <input type="hidden" id="task-id" value="" />

        <label for="task-title">Title</label>
        <input type="text" id="task-title" name="task-title" required />

        <label for="task-description">Description</label>
        <textarea id="task-description" name="task-description"></textarea>

        <div class="form-actions">
          <button type="submit" id="task-submit">Add Task</button>
          <button type="button" id="task-cancel-edit" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <section class="list-section">
      <h2>Tasks</h2>
      <div id="task-list"></div>
    </section>

    <p id="status-message" role="status"></p>

    <footer>
      <a id="contribution-link" href="contribution.html">Team Contribution Page</a>
    </footer>
  </main>

  <template id="task-item-template">
    <div class="task-item">
      <h3 class="task-title"></h3>
      <p class="task-description"></p>
      <p class="task-status"></p>
      <div class="task-actions">
        <button class="toggle-task" type="button"></button>
        <button class="edit-task" type="button">Edit</button>
        <button class="delete-task" type="button">Delete</button>
      </div>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
